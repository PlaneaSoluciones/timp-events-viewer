name: Secret Scan

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gitleaks:
    name: Detectar secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        # Versión fija: consultar la "latest" a la API de GitHub falla a veces sin token y tumba el job.
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${tarball}$" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Escanear repo
        run: gitleaks detect --source . --redact -v
